name: Android CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build the release APK in addition to the debug APK'
        type: boolean
        required: false
        default: true
      run_tests:
        description: 'Run JVM unit tests'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (JVM, no emulator)
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Assemble release APK
        if: ${{ github.event.inputs.build_release != 'false' }}
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Lint (non blocking)
        continue-on-error: true
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="$(grep -E '^[[:space:]]*versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/' | head -1)"
          echo "version=${version:-1.0.0}" >> "$GITHUB_OUTPUT"
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "artifacts/MihadLive-debug-${version:-1.0.0}.apk"
          done
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "artifacts/MihadLive-release-${version:-1.0.0}.apk"
          done
          for f in app/build/outputs/mapping/release/mapping.txt; do
            [ -e "$f" ] || continue
            cp "$f" "artifacts/mapping-${version:-1.0.0}.txt"
          done
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MihadLive-APK-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
